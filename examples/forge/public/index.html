<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forge — ledger</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --bg: #0F172A;
      --fg: #F8FAFC;
      --muted: #94A3B8;
      --card: #1A2234;
      --line: #334155;
      --gold: #F59E0B;
      --on-gold: #0F172A;
      --ok: #34D399;
      --bad: #F87171;
      --ring: #F59E0B;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--fg); font-family: "IBM Plex Sans", Segoe UI, system-ui, sans-serif; }
    body { min-height: 100vh; }
    a { color: var(--gold); }
    :focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
    header {
      display: flex; align-items: baseline; justify-content: space-between; gap: 1rem;
      padding: 1.25rem 1.5rem; border-bottom: 1px solid var(--line);
    }
    .brand { font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; font-size: 0.85rem; }
    .brand span { color: var(--gold); }
    .status { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 0.75rem; color: var(--muted); }
    .status.up { color: var(--ok); }
    .status.down { color: var(--bad); }
    main { max-width: 72rem; margin: 0 auto; padding: 1.5rem; display: grid; gap: 1.25rem; }
    @media (min-width: 900px) { main { grid-template-columns: 1.1fr 1fr; } }
    .panel { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 1.1rem 1.2rem; }
    h1, h2 { margin: 0 0 0.35rem; font-size: 1.05rem; font-weight: 600; }
    p.lead { margin: 0 0 1rem; color: var(--muted); font-size: 0.92rem; }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    th { text-align: left; color: var(--muted); font-weight: 500; font-size: 0.75rem; letter-spacing: 0.04em; text-transform: uppercase; }
    th, td { padding: 0.45rem 0; border-bottom: 1px solid var(--line); }
    td.mono { font-family: "IBM Plex Mono", ui-monospace, monospace; }
    form { display: grid; gap: 0.55rem; margin-top: 0.9rem; }
    label { font-size: 0.75rem; color: var(--muted); }
    input {
      width: 100%; margin-top: 0.2rem; padding: 0.55rem 0.65rem; border-radius: 6px;
      border: 1px solid var(--line); background: #0B1220; color: var(--fg);
      font: inherit;
    }
    button {
      cursor: pointer; border: 0; border-radius: 6px; padding: 0.6rem 0.9rem;
      background: var(--gold); color: var(--on-gold); font-weight: 600; font: inherit;
    }
    button:hover { filter: brightness(1.08); }
    button.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); font-weight: 500; }
    .row { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .err { color: var(--bad); font-size: 0.85rem; min-height: 1.2em; }
    empty-note, .empty { color: var(--muted); font-size: 0.85rem; }
    @media (prefers-reduced-motion: reduce) {
      button { transition: none; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">Buraaq <span>Forge</span></div>
    <div id="health" class="status" role="status">checking postgres…</div>
  </header>
  <main>
    <section class="panel">
      <h1>Accounts</h1>
      <p class="lead">Neon-backed rows. Same-origin writes; curl needs <code>X-Api-Key: forge-key</code>.</p>
      <div class="row">
        <button type="button" class="ghost" id="reload">Reload</button>
      </div>
      <table aria-label="Accounts">
        <thead><tr><th>Id</th><th>Name</th><th>Note</th></tr></thead>
        <tbody id="accounts"><tr><td colspan="3" class="empty">Loading…</td></tr></tbody>
      </table>
      <form id="acct-form">
        <label>Name <input name="name" required autocomplete="off"></label>
        <label>Note <input name="note" autocomplete="off"></label>
        <button type="submit">Add account</button>
      </form>
    </section>
    <section class="panel">
      <h2>Ledger</h2>
      <p class="lead">Cents as text on the wire. SQL in memo is stored as text, not executed.</p>
      <table aria-label="Ledger">
        <thead><tr><th>Id</th><th>Account</th><th>Cents</th><th>Memo</th></tr></thead>
        <tbody id="ledger"><tr><td colspan="4" class="empty">Loading…</td></tr></tbody>
      </table>
      <form id="led-form">
        <label>Account <input name="account" required value="checking" autocomplete="off"></label>
        <label>Cents <input name="cents" required value="100" inputmode="numeric" autocomplete="off"></label>
        <label>Memo <input name="memo" value="forge" autocomplete="off"></label>
        <button type="submit">Post entry</button>
      </form>
      <p class="err" id="err" aria-live="polite"></p>
    </section>
  </main>
  <script>
    const err = document.getElementById("err");
    const healthEl = document.getElementById("health");

    async function json(url, opt) {
      const r = await fetch(url, opt);
      const t = await r.text();
      let data = t;
      try { data = t ? JSON.parse(t) : null; } catch (_) {}
      if (!r.ok) throw new Error(typeof data === "string" ? data : (data && data.error) || r.status);
      return data;
    }

    function rows(el, list, cols) {
      const items = Array.isArray(list) ? list : (list && (list.rows || list.items)) || [];
      if (!items.length) {
        el.innerHTML = '<tr><td colspan="' + cols.length + '" class="empty">No rows</td></tr>';
        return;
      }
      el.innerHTML = items.map(function (row) {
        return "<tr>" + cols.map(function (c) {
          var v = row[c] == null ? "" : String(row[c]);
          return '<td class="mono">' + v.replace(/[<>&]/g, function (ch) {
            return ({ "<": "&lt;", ">": "&gt;", "&": "&amp;" })[ch];
          }) + "</td>";
        }).join("") + "</tr>";
      }).join("");
    }

    async function load() {
      err.textContent = "";
      try {
        const h = await json("/api/health");
        if (h && h.ok !== false) {
          healthEl.textContent = "postgres connected";
          healthEl.className = "status up";
        } else {
          const why = (h && h.error) ? String(h.error) : "unreachable";
          healthEl.textContent = "postgres down — " + why;
          healthEl.className = "status down";
        }
      } catch (e) {
        healthEl.textContent = "postgres down — unreachable";
        healthEl.className = "status down";
      }
      try {
        rows(document.getElementById("accounts"), await json("/api/accounts"), ["id", "name", "note"]);
        rows(document.getElementById("ledger"), await json("/api/ledger"), ["id", "account", "cents", "memo"]);
      } catch (e) {
        err.textContent = String(e.message || e);
      }
    }

    document.getElementById("reload").addEventListener("click", load);
    document.getElementById("acct-form").addEventListener("submit", async function (ev) {
      ev.preventDefault();
      const f = ev.target;
      try {
        await json("/api/accounts", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name: f.name.value, note: f.note.value })
        });
        f.reset();
        await load();
      } catch (e) { err.textContent = String(e.message || e); }
    });
    document.getElementById("led-form").addEventListener("submit", async function (ev) {
      ev.preventDefault();
      const f = ev.target;
      try {
        await json("/api/ledger", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ account: f.account.value, cents: f.cents.value, memo: f.memo.value })
        });
        await load();
      } catch (e) { err.textContent = String(e.message || e); }
    });
    load();
  </script>
</body>
</html>
