[package]
name = "buraaq_pkg"
description = "Buraaq package manager, build graph, and project tooling"
version.workspace = true
edition.workspace = true

[dependencies]
buraaq_parser = { path = "../parser" }
buraaq_diagnostics = { path = "../diagnostics" }
buraaq_source = { path = "../source" }
buraaq_ast = { path = "../ast" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
semver = "1"
thiserror = { workspace = true }
sha2 = "0.10"
hex = "0.4"
walkdir = "2"

[dev-dependencies]
toml = "0.8"
