[workspace]
resolver = "2"
members = [
    "buraaq",
    "source",
    "diagnostics",
    "ast",
    "lexer",
    "parser",
    "types",
    "ownership",
    "borrow",
    "semantic",
    "frontend",
    "mir",
    "interp",
    "codegen",
    "driver",
    "pkg",
    "ship",
    "ai",
    "fmt",
    "doc",
    "lsp",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT"
authors = ["Buraaq Contributors"]

[workspace.dependencies]
thiserror = "2"
unicode-width = "0.2"
