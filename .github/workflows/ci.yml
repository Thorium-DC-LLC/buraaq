name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: compiler tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Build CLI
        working-directory: compiler
        run: cargo build -p buraaq
      - name: Unit tests
        working-directory: compiler
        run: cargo test --workspace --lib
      - name: CLI version
        run: compiler/target/debug/buraaq --version
        shell: bash
